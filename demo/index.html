<!doctype html>
<html><head><meta charset="utf-8"><title>ACM Leaderboard demo</title>
<link rel="stylesheet" href="../leaderboard.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #f3f4f6; color: #1f2329; }
  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .page h1 { font-size: 22px; margin: 0 0 6px; } .page p { color: #6a7380; margin: 0 0 24px; }
  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 18px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .card span { color: #6a7380; font-size: 12px; }
</style></head>
<body>
<div class="page">
  <h1>Demo Contest</h1><p>Any contest page on hackerrank.com</p>
  <div class="card"><b>Signal Towers</b><span>Max score 100</span></div>
  <div class="card"><b>River Crossing</b><span>Max score 100</span></div>
  <div class="card"><b>Prime Garden</b><span>Max score 150</span></div>
  <div class="card"><b>Maze Runner</b><span>Max score 200</span></div>
</div>
<script src="mock.js"></script>
<script src="../leaderboard.js"></script>
<script src="../content.js"></script>
<script>
  const mode = location.hash.slice(1);
  if (mode !== 'button') {
    document.getElementById('hracm-open').click();
    const $ = (id) => document.getElementById(id);
    $('hracm-slug').value = 'demo-contest';
    if (mode === 'filter') $('hracm-filter').value = 'team';
    $('hracm-auto').checked = true;
    $('hracm-load').click();
  }
</script>
</body></html>
